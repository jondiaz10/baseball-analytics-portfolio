version: 2

models:
  - name: rpt_league_batting_kpis
    description: >
      League-wide batting KPIs as a single summary row (exit velocity, xwOBA,
      hard-hit rate), denominator-weighted from mart_batter_game_stats. Feeds
      dashboard scorecards.

  - name: rpt_league_pitching_kpis
    description: >
      League-wide pitching KPIs as a single summary row (velocity, whiff rate,
      strike pct), denominator-weighted from mart_pitcher_game_stats. Feeds
      dashboard scorecards.

  - name: rpt_batter_season
    description: >
      Season-to-date batting line per batter, SPLIT BY TEAM STINT and
      denominator-weighted. Grain: one row per (batter_id, batter_team) -- a
      traded batter has one row per club, and there is no synthetic combined row
      (the combined season line is a downstream SUM over the stints). Named via
      the player_lookup registry. Composite-grain uniqueness is enforced by the
      singular test assert_one_row_per_batter_team_season.
    columns:
      - name: batter_id
        description: MLBAM player id (part of the composite grain, no longer unique alone).
        tests:
          - not_null
      - name: batter_team
        description: Event-derived team-of-record (abbrev) for this stint; grain key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_abbrev

  - name: rpt_batter_game
    description: >
      Per-game batting detail (game-log / drill-down). One row per batter per
      game. Carries the event-derived team-of-record (batter_team) for the date
      of the game, resolved to team_id / name / league / division via dim_team.
    columns:
      - name: batter_id
        description: MLBAM player id.
        tests:
          - not_null
      - name: game_date
        description: Date of the game.
        tests:
          - not_null
      - name: batter_team
        description: Event-derived team-of-record (abbrev) for the batter on this game's date.
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_abbrev
      - name: at_bats
        description: At-bats in the game (passthrough from mart_batter_game_stats).
        tests:
          - not_null
      - name: hits
        description: Total hits in the game (singles + doubles + triples + home runs).
        tests:
          - not_null
      - name: singles
        description: Singles in the game.
        tests:
          - not_null
      - name: doubles
        description: Doubles in the game.
        tests:
          - not_null
      - name: triples
        description: Triples in the game.
        tests:
          - not_null
      - name: home_runs
        description: Home runs in the game.
        tests:
          - not_null
      - name: strikeouts
        description: Strikeouts in the game (incl. strikeout double plays).
        tests:
          - not_null
      - name: walks
        description: Walks in the game (incl. intentional).
        tests:
          - not_null
      - name: barrel_count
        description: >
          Barreled balls in the game (launch_speed_angle = 6). Legitimately NULL on
          games with no batted-ball events, so no not_null guard.
      - name: avg_xba
        description: >
          Average expected batting average on batted balls. NULL when no balls were
          put in play (all walks/strikeouts), so no not_null guard.
      - name: avg_xslg
        description: >
          Average expected slugging on batted balls. NULL when no balls were put in
          play, so no not_null guard.

  - name: rpt_pitcher_season
    description: >
      Season-to-date pitching line per pitcher, SPLIT BY TEAM STINT and
      denominator-weighted. Grain: one row per (pitcher_id, pitching_team) -- a
      traded pitcher has one row per club, no synthetic combined row (combined is
      a downstream SUM). Name/handedness come from the mart. Composite-grain
      uniqueness is enforced by assert_one_row_per_pitcher_team_season.
    columns:
      - name: pitcher_id
        description: MLBAM player id (part of the composite grain, no longer unique alone).
        tests:
          - not_null
      - name: pitching_team
        description: Event-derived team-of-record (abbrev) for this stint; grain key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_abbrev

  - name: rpt_pitcher_pitch_mix
    description: >
      Pitch mix in long format, SPLIT BY TEAM STINT. Grain: one row per
      (pitcher_id, pitching_team, pitch_type), with the season pitch_pct
      re-weighted by total pitches WITHIN the stint (never blended across a
      trade). Composite-grain uniqueness is enforced by
      assert_one_row_per_pitcher_team_pitchtype.
    columns:
      - name: pitcher_id
        description: MLBAM player id (part of the composite grain).
        tests:
          - not_null
      - name: pitching_team
        description: Event-derived team-of-record (abbrev) for this stint; grain key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_abbrev
      - name: pitch_type
        description: Normalized pitch-type label.
        tests:
          - not_null
          - accepted_values:
              values:
                - four_seam
                - sinker
                - cutter
                - slider
                - sweeper
                - curveball
                - changeup
                - splitter
                - other
