version: 2

sources:
  - name: raw
    database: baseball-analytics-portfolio
    schema: raw
    tables:
      - name: statcast_pitches
        description: >
          Raw Statcast pitch-level data loaded from Baseball Savant via the
          ingestion pipeline. One row per pitch. Loaded in parquet format via GCS.
      - name: player_lookup
        description: >
          Chadwick Bureau player registry. Maps MLB MLBAM IDs to player names
          and metadata. Full refresh on each pipeline run.
      - name: mlb_teams
        description: >
          MLB clubs (team dimension) from the MLB Stats API. One row per team
          with league / division / venue. Full refresh on each pipeline run.
      - name: mlb_rosters
        description: >
          MLB 40-man rosters from the MLB Stats API — the player -> team
          mapping, keyed on mlbam_id. Full refresh on each pipeline run.
      - name: mlb_roster_status
        description: >
          MLB fullRoster feed from the MLB Stats API — every rostered player
          with availability status (Active / IL flavors / Minors / etc.), keyed
          on mlbam_id. The full population incl. 60-Day IL. Full refresh each run.
