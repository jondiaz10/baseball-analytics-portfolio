# Configuration for the Statcast ingestion pipeline.
# All runtime values live here so nothing is hardcoded in the source.

gcs:
  bucket: baseball-analytics-raw-data
  prefix: statcast/

bigquery:
  project: baseball-analytics-portfolio
  raw_dataset: raw
  table: statcast_pitches

extract:
  # Number of days to pull per request to avoid Baseball Savant rate limiting.
  chunk_size_days: 7

reference_tables:
  player_lookup:
    dataset: raw
    table: player_lookup
